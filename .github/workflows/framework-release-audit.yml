name: KristalDiag Framework Release Audit

on:
  workflow_dispatch:
    inputs:
      framework_ref:
        description: "KristalV10 commit/tag to audit"
        required: true
        default: "27c0c7db3d79a4597c1c964fe8281fa35b5f858a"

permissions:
  contents: read

jobs:
  release-audit:
    name: Independent Framework release audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout KristalDiag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: KristalDiag
          persist-credentials: false
      - name: Checkout selected KristalV10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Rejean-McCormick/KristalV10
          ref: ${{ inputs.framework_ref }}
          path: KristalV10
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install KristalDiag release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e KristalDiag
          if [ -f KristalV10/requirements-dev.txt ]; then python -m pip install -r KristalV10/requirements-dev.txt; fi
      - name: Run independent V10-Full qualification
        run: >-
          kristaldiag conform KristalV10
          --profile V10-Standard
          --control-dir "$RUNNER_TEMP/kristaldiag-v10"
      - name: Run broad independent release campaign
        if: always()
        run: >-
          kristaldiag run release KristalV10
          --control-dir "$RUNNER_TEMP/kristaldiag-release"
      - name: Verify produced evidence
        if: always()
        run: |
          for d in "$RUNNER_TEMP/kristaldiag-v10" "$RUNNER_TEMP/kristaldiag-release"; do
            if [ -f "$d/current/summary.json" ]; then
              kristaldiag verify-run "$d/current/summary.json"
            fi
          done
      - name: Prepare audit evidence
        if: always()
        run: |
          mkdir -p ci-evidence/v10 ci-evidence/release
          [ ! -d "$RUNNER_TEMP/kristaldiag-v10/current" ] || cp -a "$RUNNER_TEMP/kristaldiag-v10/current/." ci-evidence/v10/
          [ ! -d "$RUNNER_TEMP/kristaldiag-release/current" ] || cp -a "$RUNNER_TEMP/kristaldiag-release/current/." ci-evidence/release/
          {
            echo "KristalDiag=$(git -C KristalDiag rev-parse HEAD)"
            echo "KristalV10=$(git -C KristalV10 rev-parse HEAD)"
            echo "Kristal-Version=$(python -c 'import json; print(json.load(open("KristalV10/contracts/release.json"))["version"])')"
          } > ci-evidence/subjects.txt
      - name: Upload release-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kristaldiag-release-audit-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: ci-evidence/
