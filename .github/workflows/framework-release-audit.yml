name: KristalDiag Framework Release Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-audit:
    name: Independent Framework release audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      KRISTAL_FRAMEWORK_REF: "00a00e061dd216a9bcdb281cf1eeef80ce61410e"

    steps:
      - name: Checkout KristalDiag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: KristalDiag
          persist-credentials: false

      - name: Checkout pinned Kristal Framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Rejean-McCormick/Kristal-Framework
          ref: ${{ env.KRISTAL_FRAMEWORK_REF }}
          path: Kristal-Framework
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install KristalDiag release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e KristalDiag
          python -m pip install -r Kristal-Framework/requirements-dev.txt

      - name: Run independent release campaign
        run: >-
          kristaldiag run release Kristal-Framework
          --control-dir "$RUNNER_TEMP/kristaldiag-release"

      - name: Verify produced evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/kristaldiag-release/current/summary.json" ]; then
            kristaldiag verify-run "$RUNNER_TEMP/kristaldiag-release/current/summary.json"
          else
            echo "No release-audit summary was produced."
            exit 1
          fi

      - name: Prepare audit evidence
        if: always()
        run: |
          mkdir -p ci-evidence/kristaldiag-release
          if [ -d "$RUNNER_TEMP/kristaldiag-release/current" ]; then
            cp -a "$RUNNER_TEMP/kristaldiag-release/current/." ci-evidence/kristaldiag-release/
          fi
          {
            echo "KristalDiag=$(git -C KristalDiag rev-parse HEAD)"
            echo "Kristal-Framework=$(git -C Kristal-Framework rev-parse HEAD)"
            echo "Kristal-Version=$(cat Kristal-Framework/VERSION)"
          } > ci-evidence/subjects.txt

      - name: Upload release-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kristaldiag-release-audit-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: ci-evidence/
