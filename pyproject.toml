[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kristaldiag"
version = "0.9.0"
description = "Consolidated diagnostics, release qualification and conformance suite for Kristal Standard v9"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]
authors = [{name = "Kristal Project"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
kristaldiag = "kristaldiag.cli:main"

[tool.setuptools]
packages = ["kristaldiag"]
include-package-data = true

[tool.setuptools.package-data]
kristaldiag = ["resources/**/*.json", "resources/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
